<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Угольный Яр">
<meta name="application-name" content="Угольный Яр">
<meta name="theme-color" content="#070b1d">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Угольный Яр</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1220; --panel:#151c2e; --line:#26304a; --text:#e8ecf4; --dim:#8a93a8;
    --gold:#f4c84a; --red:#ff5a4f; --green:#4fd17a; --blue:#6cc6ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;background:#070b1d;color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
  body{display:flex;justify-content:center;
    background:radial-gradient(circle at 50% 0%,#1b2440 0%,var(--bg) 60%);}
  body{position:fixed;inset:0}
  #app{width:100%;max-width:520px;height:100%;height:100dvh;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);display:flex;flex-direction:column;position:relative;overflow:hidden}
  #stage{position:relative;height:calc(42vh + env(safe-area-inset-top));min-height:230px;max-height:460px;flex:none;background:#070b1d}
  #city{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* HUD */
  #hud{position:absolute;left:0;right:0;top:0;z-index:2;padding:8px 10px 10px;padding-top:calc(8px + env(safe-area-inset-top));
    background:linear-gradient(180deg,rgba(7,10,22,.85),rgba(7,10,22,.45) 70%,rgba(7,10,22,0));pointer-events:none}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .row{gap:5px}
  .chip{font-size:10.5px;font-weight:800;letter-spacing:.3px;padding:3px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.12);color:#cdd3e0;white-space:nowrap;background:rgba(10,14,28,.55);backdrop-filter:blur(4px)}
  .chip.r{color:var(--red);border-color:#6b2a2a}
  .chip.g{color:var(--green);border-color:#285c3a}
  .chip.y{color:var(--gold);border-color:#6b5a22}
  .chip.b{color:var(--blue);border-color:#24506b}
  .bar{height:5px;background:rgba(31,40,64,.8);border-radius:3px;margin-top:6px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#2fae5c,var(--green));width:0;transition:width .8s}
  /* лог */
  #log{z-index:1;flex:1 1 0;overflow-y:auto;padding:8px 16px 8px;scroll-behavior:smooth;min-height:44px}
  .p{margin:0 0 9px;line-height:1.42;font-size:15.5px;animation:in .35s ease both}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .h{font-size:21px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--gold);text-align:center;margin:6px 0 14px;text-shadow:0 2px 0 #000}
  .big{font-size:36px;font-weight:900;text-align:center;color:var(--gold);margin:4px 0 10px;text-shadow:0 3px 0 #000}
  .big.r{color:var(--red)}
  .stamp{margin:12px auto;width:max-content;max-width:90%;padding:8px 18px;border:4px solid var(--red);color:var(--red);
    font-weight:900;font-size:22px;letter-spacing:1px;transform:rotate(-6deg);border-radius:6px;text-align:center;opacity:.9}
  .quote{color:var(--blue);font-style:italic;border-left:3px solid var(--blue);padding-left:10px}
  .gold{color:var(--gold);font-weight:700}.red{color:var(--red);font-weight:700}.green{color:var(--green);font-weight:700}
  .blue{color:var(--blue)}.dim{color:var(--dim);font-size:14px}
  .delta{font-size:14px;font-weight:700;margin:-4px 0 8px}
  /* кнопки */
  #ctl{z-index:1;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:rgba(13,18,32,.92);border-top:1px solid var(--line)}
  .q{font-weight:800;font-size:15px;margin:0 0 8px;color:var(--text)}
  .btn{display:block;width:100%;text-align:left;margin:0 0 7px;padding:10px 13px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:15px;line-height:1.3;cursor:pointer;font-family:inherit}
  .btn:active{transform:scale(.98);background:#1d2640}
  .btn .cost{display:block;margin-top:4px;font-size:13px;font-weight:800;color:var(--gold)}
  .btn .cost.plus{color:var(--green)}
  .btn:disabled{opacity:.45}
  .btn:disabled .cost{color:var(--red)}
  .btn.next{text-align:center;background:var(--gold);color:#1a1405;font-weight:900;border:none}
  .btn.end{text-align:center;border-color:var(--gold);color:var(--gold);font-weight:800}
  .caps{display:flex;gap:8px;margin-bottom:8px}
  .cap{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12px;color:var(--dim)}
  .cap b{display:block;font-size:17px;color:var(--text)}
  .opts{max-height:40vh;overflow-y:auto}
  .caps{flex-wrap:wrap}
  .cap{min-width:calc(33% - 6px)}
  .cap.warn{border-color:#6b2a2a;color:#ff9a8f}
  .cap.warn b{color:var(--red)}
  .opts.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:38vh}
  .opts.grid .btn{margin:0;padding:9px 10px;font-size:14px;font-weight:700}
  .opts.grid .btn small{display:block;font-weight:500;font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.25}
  .opts.grid .btn .cost{font-size:12px;margin-top:3px}
  .pin{padding-top:8px;display:flex;gap:7px}
  .pin .btn{flex:1;font-size:14px;padding:10px 8px;white-space:nowrap}
  #ctl{flex:0 1 auto;min-height:0;display:flex;flex-direction:column}
  #ctl > *{flex:none}
  #ctl > .opts{flex:1 1 auto;min-height:56px;overflow-y:auto}
  .pin .btn{margin:0}
  .btn.next{text-align:center;background:var(--gold);color:#1a1405;font-weight:900;border:none}

</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="city"></canvas><div id="hud"></div></div>
  <div id="log"></div>
  <div id="ctl"></div>
</div>
<script>
"use strict";
// ═══════════════════════════════════════════════════════════════════
//  CITY — нарисованная панорама Угольного Яра, которая меняется от решений
//  Мир: 1000 × 420 условных единиц, земля на y = 340.
//  Рендерер читает состояние игры G каждый кадр и анимирует изменения.
// ═══════════════════════════════════════════════════════════════════
const City = (() => {
  const WW = 1000, WH = 420, GROUND = 340;
  let cv, ctx, cw = 0, ch = 0, dpr = 1, base = 1;
  let T = 0, last = 0;
  const cam = { x: 520, y: 210, z: 1, tx: 520, ty: 210, tz: 1, until: 0 };
  const anims = {};         // ключ элемента → { t0, prev }
  const keys = {};          // последнее состояние элементов
  const parts = [];         // частицы в мире
  const floats = [];        // всплывающие надписи (экран)
  const snow = [];          // снег (экран)
  let glows = [];           // источники света этого кадра
  let started = false;
  let flash = 0;

  // ── детерминированный рандом ──
  const emitT = {};
  function every(id, sec) { const n = Math.floor(T / sec); if (emitT[id] !== n) { emitT[id] = n; return true; } return false; }
  function hash(n) { n = (n << 13) ^ n; return ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 0x7fffffff; }

  // ── кэш светящихся спрайтов (HDR-блум) ──
  const glowCache = {};
  function glowSprite(col) {
    if (glowCache[col]) return glowCache[col];
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const g = c.getContext("2d");
    const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    r.addColorStop(0, col); r.addColorStop(0.18, col.replace(/[\d.]+\)$/, "0.55)"));
    r.addColorStop(0.5, col.replace(/[\d.]+\)$/, "0.12)")); r.addColorStop(1, col.replace(/[\d.]+\)$/, "0)"));
    g.fillStyle = r; g.fillRect(0, 0, 128, 128);
    return (glowCache[col] = c);
  }
  const WARM = "rgba(255,200,110,1)", HOT = "rgba(255,150,70,1)", COLD = "rgba(140,200,255,1)",
        REDL = "rgba(255,70,60,1)", GREENL = "rgba(110,255,170,1)", WHITE = "rgba(255,245,225,1)";
  function glow(x, y, r, col, a = 1, p = 1) { glows.push([x, y, r, col, a, p]); }

  function bounds() { return G && G.act >= 3 && G.a3 && (G.a3.games || G.a3.tower) ? [-1200, 2050] : G && G.act >= 2 ? [-820, 1900] : [0, 1000]; }
  // ── сезон и время ──
  function dateOf() { return new Date(2026, 10, 13 + (G ? G.day : 0)); }
  function season() {
    const m = dateOf().getMonth();               // 0..11
    const snowy = m >= 9 || m <= 3;               // окт–апр: снег лежит
    const summer = m >= 5 && m <= 7;
    return { m, snowy, summer };
  }

  // ── состояние элементов → ключи (для анимации изменений) ──
  function stateKeys() {
    const f = G.flags, v = G.vis || {};
    const k = {
      boiler: f.heat || "off", road: String(f.road ?? -1), light: f.light || "off",
      mine: (f.mine || "?") + (f.mine_open ? "+open" : ""), vent: v.ventLit ? "on" : "off",
      matvey: v.matvey ? "on" : "off",
      water: (f.water || "off") + (f.frozen ? "+ice" : ""), comm: f.comm || "off", shops: f.shops || "off",
      lift: f.lift || "off", ratrak: f.ratrak ? "on" : "off", hotel: f.hotel ? "on" : "off",
      renov: f.housing_choice || "off",
    };
    const nF = Math.min(40, Math.max(12, G.factories)), nB = Math.max(12, G.blocks);
    for (let i = 0; i < nF; i++) k["fac" + i] = i < G.factories ? "on" : "off";
    for (let i = 0; i < nB; i++) k["blk" + i] = i < G.blocks ? "on" : "off";
    Object.assign(k, { rail: f.rail || "off", energy: f.energy || "off", airport: f.airport || "off", uni: f.uni ? "on" : "off", med: f.med ? "on" : "off",
      tram: f.tram ? "on" : "off", museum: f.museum ? "on" : (f.demolished ? "gone" : "off"), mineFate: f.mineFate || "off", cup: f.cup ? "on" : "off", filters: f.filters ? "on" : "off" });
    for (let i = 0; i < 24; i++) { k["mic" + i] = i < (G.micro || 0) ? "on" : "off"; }
    for (let i = 0; i < 12; i++) { k["sch" + i] = i < (G.schools || 0) ? "on" : "off"; k["hos" + i] = i < (G.hospitals || 0) ? "on" : "off"; k["par" + i] = i < (G.parks || 0) ? "on" : "off"; k["mal" + i] = i < (G.malls || 0) ? "on" : "off"; }
    const a3k = G.a3 || {};
    Object.assign(k, { metro: a3k.metro && a3k.metro !== "bus" ? a3k.metro : "off", bridge: a3k.bridge || "off", tvtower: a3k.tower || "off", stadium: a3k.games ? "on" : "off", vsm: a3k.vsm ? "on" : "off", monument: a3k.matvey || "off" });
    k.sky = G.pop >= 200000 ? String(Math.min(9, Math.floor((G.pop - 200000) / 100000) + 1)) : "off";
    return k;
  }
  // где находится элемент: [x, y, слой параллакса, зум]
  const SPOTS = {
    boiler: [282, 250, 1, 1.9], road: [170, 360, 1, 1.5], light: [330, 300, 1, 1.7], mine: [95, 250, 1, 1.8],
    vent: [160, 315, 1, 2.6], matvey: [160, 320, 1, 2.8], water: [205, 270, 1, 1.9], comm: [690, 220, 0.95, 1.5],
    shops: [420, 320, 1, 2.0], lift: [770, 210, 0.55, 1.4], ratrak: [770, 250, 0.55, 1.6], hotel: [915, 300, 1, 1.9],
    renov: [440, 280, 1, 1.4], town: [520, 260, 1, 1.0],
    wide: [540, 235, 1, .62], rail: [-130, 340, 1, 1.4], energy: [-400, 240, .8, 1.2], hydro: [-280, 290, .7, 1.4], wind: [200, 200, .35, 1.0], airport: [-80, 190, .5, 1.1],
    uni: [1210, 280, 1, 1.5], med: [1060, 290, 1, 1.7], north: [1450, 220, .9, 1.0], tram: [500, 330, 1, 1.4],
    metro: [380, 320, 1, 1.7], river: [820, 380, 1, .9], bridge: [820, 330, 1, .85], tvtower: [-150, 150, .62, .8], stadium: [-640, 260, .8, 1.15], vsm: [-150, 370, 1, 1.1], monument: [658, 320, 1, 2.6],
    museum: [95, 230, 1, 1.5], mineFate: [95, 260, 1, 1.6], cup: [770, 200, .55, 1.3], filters: [400, 220, .78, 1.0], sky: [1400, 200, .84, .9],
  };
  function spotFor(k) {
    if (k === "energy" && G && G.flags.energy && SPOTS[G.flags.energy === "tec" ? "energy" : G.flags.energy]) return SPOTS[G.flags.energy === "tec" ? "energy" : G.flags.energy];
    if (SPOTS[k]) return SPOTS[k];
    if (k.startsWith("fac")) { const s = facPos(+k.slice(3)); return [s[0], 270, 0.78, 1.3]; }
    if (k.startsWith("blk")) { const s = blkPos(+k.slice(3)); return [s[0] + s[1] / 2, 260, 0.88, 1.35]; }
    if (k.startsWith("mic")) { const x = micPos(+k.slice(3)); return [x + 60, 220, 0.9, 1.1]; }
    if (k.startsWith("sch")) { const x = SCH[+k.slice(3) % SCH.length]; return [x + 30, 300, 1, 1.8]; }
    if (k.startsWith("hos")) { const x = HOS[+k.slice(3) % HOS.length]; return [x + 35, 300, 1, 1.8]; }
    if (k.startsWith("par")) { const x = PAR[+k.slice(3) % PAR.length]; return [x, 290, .97, 1.6]; }
    if (k.startsWith("mal")) { const x = MAL[+k.slice(3) % MAL.length]; return [x + 40, 300, 1, 1.7]; }
    return SPOTS.town;
  }

  function focus(key, ms = 3800) {
    const [x, y, p, z] = spotFor(key);
    cam.tx = 500 + (x - 500) / p; cam.ty = y; cam.tz = z; cam.until = T + ms / 1000;
  }

  // ── размеры ──
  function resize() {
    const r = cv.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cw = r.width; ch = r.height;
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    base = ch / 430;
    snow.length = 0;
    const n = Math.round(cw * ch / 2600);
    for (let i = 0; i < n; i++) snow.push({ x: Math.random() * cw, y: Math.random() * ch, r: Math.random() * 1.8 + .4, s: Math.random() * 22 + 12, d: Math.random() * 10 - 5, ph: Math.random() * 6 });
  }

  // ── преобразование слоя ──
  function layer(p) {
    const S = base * cam.z * dpr;
    const cx = 500 + (cam.x - 500) * p;
    ctx.setTransform(S, 0, 0, S, cw * dpr / 2 - cx * S, ch * dpr / 2 - cam.y * S);
  }
  function toScreen(x, y, p) {
    const S = base * cam.z;
    const cx = 500 + (cam.x - 500) * p;
    return [cw / 2 + (x - cx) * S, ch / 2 + (y - cam.y) * S];
  }

  // ── анимация появления: 0 → 1 за dur секунд ──
  function prog(key, dur = 1.4) {
    const a = anims[key]; if (!a) return 1;
    const t = (T - a.t0) / dur; if (t >= 1) return 1;
    return t < 0 ? 0 : 1 - Math.pow(1 - t, 3);
  }

  // ── примитивы ──
  function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
  function poly(pts, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fill(); }
  function circ(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }
  function line(x1, y1, x2, y2, w, c) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  function text(s, x, y, size, c, align = "center", weight = 800) { ctx.fillStyle = c; ctx.font = `${weight} ${size}px Unbounded, system-ui, sans-serif`; ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillText(s, x, y); }

  function puff(x, y, p, col = "220,226,238", big = 1, vy = -14) {
    parts.push({ type: "smoke", x, y, p, vx: 4 + Math.random() * 4, vy: vy - Math.random() * 6, r: (3 + Math.random() * 2) * big, gr: 6 * big, life: 4 + Math.random() * 2, t: 0, col });
  }
  function sparkle(x, y, p, n = 26) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, s = 20 + Math.random() * 60;
      parts.push({ type: "spark", x, y, p, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, life: .8 + Math.random() * .7, t: 0, r: 1 + Math.random() * 1.4 });
    }
    for (let i = 0; i < 10; i++) parts.push({ type: "dust", x: x + (Math.random() - .5) * 60, y: y + 30, p, vx: (Math.random() - .5) * 30, vy: -10 - Math.random() * 10, r: 5 + Math.random() * 6, life: 1.6, t: 0 });
  }

  // ════════════════════════ СЛОИ ════════════════════════

  function drawSky(se) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, ch);
    if (se.summer) { g.addColorStop(0, "#151a3d"); g.addColorStop(.55, "#4a3566"); g.addColorStop(.85, "#c46a52"); g.addColorStop(1, "#f0a36a"); }
    else if (se.snowy) { g.addColorStop(0, "#070b1d"); g.addColorStop(.6, "#16224a"); g.addColorStop(1, "#33467c"); }
    else { g.addColorStop(0, "#0d1230"); g.addColorStop(.6, "#2b2f5e"); g.addColorStop(1, "#7a5a7a"); }
    ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
    // звёзды
    for (let i = 0; i < 90; i++) {
      const x = (hash(i * 7 + 1) * 1.4 - .2) * cw - (cam.x - 500) * .03 * base, y = hash(i * 13 + 5) * ch * .55;
      const a = .25 + .75 * Math.abs(Math.sin(T * (.5 + hash(i) * 1.5) + i));
      ctx.globalAlpha = a * (se.summer ? .5 : 1); circ(x, y, hash(i * 3) * 1.1 + .3, "#fff");
    }
    ctx.globalAlpha = 1;
    // северное сияние зимой
    if (se.snowy) {
      ctx.globalCompositeOperation = "lighter";
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        const yb = ch * (.16 + k * .06);
        ctx.moveTo(0, yb);
        for (let x = 0; x <= cw; x += 12) ctx.lineTo(x, yb + Math.sin(x * .012 + T * .25 + k * 1.7) * 14 + Math.sin(x * .03 - T * .4) * 5);
        ctx.lineTo(cw, yb + 60); ctx.lineTo(0, yb + 60); ctx.closePath();
        const ag = ctx.createLinearGradient(0, yb - 10, 0, yb + 60);
        ag.addColorStop(0, `rgba(90,255,170,${.10 - k * .025})`); ag.addColorStop(1, "rgba(60,140,255,0)");
        ctx.fillStyle = ag; ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
    }
    // луна
    const [mx, my] = [cw * .82 - (cam.x - 500) * .04 * base, ch * .17];
    ctx.globalCompositeOperation = "lighter";
    const mg = ctx.createRadialGradient(mx, my, 4, mx, my, 70);
    mg.addColorStop(0, "rgba(255,240,200,.35)"); mg.addColorStop(1, "rgba(255,240,200,0)");
    ctx.fillStyle = mg; ctx.fillRect(mx - 70, my - 70, 140, 140);
    ctx.globalCompositeOperation = "source-over";
    circ(mx, my, 14, "#f6efd6");
    circ(mx + 6, my - 4, 12, se.summer ? "#2a2850" : "#121a3c");
  }

  function drawFarHills(se) {
    layer(0.3);
    const c1 = se.snowy ? "#2a3763" : "#2a2e52", c2 = se.snowy ? "#cfd8ea" : "#3d4a5a";
    poly([-1400, 340, -1100, 250, -800, 280, -600, 240, -400, 230, -200, 270, 0, 210, 220, 260, 420, 205, 640, 255, 860, 200, 1100, 250, 1400, 215, 1700, 260, 2000, 230, 2400, 270, 2400, 400, -1400, 400], c1);

    for (const [x, y, r, col, a, p] of glows) {
      if (a <= .01) continue;
      const [sx, sy] = toScreen(x, y, p), rr = r * base * cam.z;
      if (sx < -rr || sx > cw + rr || sy < -rr || sy > ch + rr) continue;
      ctx.globalAlpha = Math.min(1, a);
      ctx.drawImage(glowSprite(col), (sx - rr) * dpr, (sy - rr) * dpr, rr * 2 * dpr, rr * 2 * dpr);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }
  function post(se) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // тонирование: холодные тени, тёплые света
    ctx.globalCompositeOperation = "soft-light";
    const g = ctx.createLinearGradient(0, 0, 0, ch);
    g.addColorStop(0, se.summer ? "rgba(255,140,90,.25)" : "rgba(60,110,255,.22)"); g.addColorStop(1, "rgba(255,170,90,.18)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
    ctx.globalCompositeOperation = "source-over";
    // виньетка
    const v = ctx.createRadialGradient(cw / 2, ch * .55, Math.min(cw, ch) * .3, cw / 2, ch * .55, Math.max(cw, ch) * .8);
    v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(3,5,14,.65)");
    ctx.fillStyle = v; ctx.fillRect(0, 0, cw, ch);
    // вспышка при стройке
    if (flash > 0) { ctx.fillStyle = `rgba(255,236,190,${flash * .25})`; ctx.fillRect(0, 0, cw, ch); }
    // нижний градиент в интерфейс
    const b = ctx.createLinearGradient(0, ch - 30, 0, ch);
    b.addColorStop(0, "rgba(13,18,32,0)"); b.addColorStop(1, "rgba(13,18,32,.9)");
    ctx.fillStyle = b; ctx.fillRect(0, ch - 30, cw, 30);
  }
  function drawSnow(se, dt) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const amt = se.snowy ? 1 : (se.m === 4 || se.m === 8 ? .25 : 0);
    if (!amt) return;
    ctx.fillStyle = "#fff";
    const n = Math.floor(snow.length * amt);
    for (let i = 0; i < n; i++) {
      const s = snow[i];
      s.y += s.s * dt; s.x += (s.d + Math.sin(T + s.ph) * 6) * dt;
      if (s.y > ch) { s.y = -3; s.x = Math.random() * cw; }
      if (s.x < -3) s.x = cw + 2; else if (s.x > cw + 3) s.x = -2;
      ctx.globalAlpha = .4 + s.r * .25; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function drawFloats(dt) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i]; f.t += dt;
      if (f.t > 2.6) { floats.splice(i, 1); continue; }
      const k = f.t / 2.6, y = ch * .42 - k * 40 - i * 4;
      ctx.globalAlpha = k < .15 ? k / .15 : 1 - Math.max(0, (k - .6) / .4);
      ctx.font = `900 ${Math.round(Math.min(26, cw / 15))}px Unbounded, system-ui, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.lineWidth = 5; ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.strokeText(f.s, cw / 2, y);
      ctx.shadowColor = f.c; ctx.shadowBlur = 18; ctx.fillStyle = f.c; ctx.fillText(f.s, cw / 2, y); ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }

  // ── главный цикл ──
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!G) return;
    const now = ts / 1000, dt = Math.min(.05, last ? now - last : .016); last = now; T += dt;
    if (cv.clientWidth !== cw || cv.clientHeight !== ch) resize();
    if (!cw || !ch) return;

    // изменения состояния → анимации + фокус камеры
    const k = stateKeys();
    for (const key in k) {
      if (keys[key] === undefined) { keys[key] = k[key]; continue; }
      if (keys[key] !== k[key]) {
        keys[key] = k[key];
        if (k[key] === "off" || k[key] === "-1") continue;
        anims[key] = { t0: T + .5 };
        focus(key, 4200);
        const [x, y, p] = spotFor(key);
        setTimeout(() => { sparkle(x, y, p); flash = 1; }, 500);
      }
    }
    flash = Math.max(0, flash - dt * 1.8);

    // камера
    if (T > cam.until) {
      cam.tz = 1; cam.ty = G.act >= 3 ? 285 : 260;
      const [L, Rb] = bounds(), vw = cw / (base * cam.z);
      cam.tx = (L + Rb) / 2 + Math.sin(T * (G.act >= 2 ? .025 : .045)) * Math.max(0, (Rb - L) / 2 - vw / 2 + 40) * .95;
    }
    const e = 1 - Math.exp(-dt * 2.2);
    cam.x += (cam.tx - cam.x) * e; cam.y += (cam.ty - cam.y) * e; cam.z += (cam.tz - cam.z) * e;
    // ограничения
    const viewW = cw / (base * cam.z), viewH = ch / (base * cam.z);
    const [BL, BR] = bounds();
    cam.x = Math.max(BL + viewW / 2 - 40, Math.min(BR + 40 - viewW / 2, cam.x));
    const maxY = GROUND + (G.act >= 3 ? 122 : 78) - viewH / 2, minY = viewH / 2 + 30;
    cam.y = minY > maxY ? maxY : Math.max(minY, Math.min(maxY, cam.y));
    if (viewW > BR - BL + 80) cam.x = (BL + BR) / 2;

    const se = season();
    const litF = G.act >= 2 ? Math.min(.96, .1 + .86 * Math.pow(Math.min(1, G.pop / Math.max(1, G.housing)), 1.5)) : Math.min(.96, .015 + .95 * Math.pow(G.pop / 50000, .6));
    glows = [];
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    LITF = litF;
    drawSky(se);
    drawFarHills(se);
    drawWind(se);
    drawAirport(se);
    drawMountain(se);
    drawHydro(se);
    drawTVTower(se);
    drawStadium(se);
    drawFactories(se);
    drawTEC(se);
    drawSkyscrapers(se);
    drawPylons(se);
    drawNewBlocks(se, litF);
    drawMicro(se);
    drawTown(se, litF);
    drawCivic(se, litF);
    drawStreet(se);
    drawTram(se);
    drawRail(se);
    drawVSM(se);
    drawAct3(se);
    drawParts(dt);
    drawGlows();
    drawSmog(se);
    post(se);
    drawSnow(se, dt);
    drawFloats(dt);
  }

  return {
    init(canvas) {
      cv = canvas; ctx = cv.getContext("2d");
      resize(); addEventListener("resize", resize);
      if (!started) { started = true; requestAnimationFrame(frame); }
    },
    reset() { for (const k in emitT) delete emitT[k]; for (const k in keys) delete keys[k]; for (const k in anims) delete anims[k]; parts.length = 0; floats.length = 0; cam.until = 0; },
    focus(key, ms) { focus(key, ms); },
    float(s, c = "#4fd17a") { floats.push({ s, c, t: 0 }); if (floats.length > 4) floats.shift(); },
  };
})();


</script>
<script>
"use strict";
// ───────────── утилиты ─────────────
const $ = s => document.querySelector(s);
const LOG = $("#log"), CTL = $("#ctl"), HUD = $("#hud");
const sleep = ms => new Promise(r => setTimeout(r, ms * (window.__speed ?? 1)));
const fmt = n => Math.round(n).toLocaleString("ru-RU").replace(/,/g, " ");
const money = n => (n < 0 ? "−" : "") + fmt(Math.abs(n)) + " ₽";

const START = new Date(2026, 10, 13);
const DEADLINE = 365, GOAL = 50000;

let G;
function newGame() {
  G = { day: 0, budget: 12000000, pop: 312, trust: 50, income: {}, flags: {}, chapter: "ПРОЛОГ",
        housing: 0, jobs: 0, factories: 0, blocks: 0, ads: 0, vis: {},
        act: 1, goal: GOAL, deadline: DEADLINE, step: 0, month: 0, year: 1,
        schools: 0, hospitals: 0, parks: 0, malls: 0, micro: 0, smog: 0, capBonus: 0, a2: {}, a3: {}, log: [] };
  City.reset();
}
// ───────────── сохранение ─────────────
const SAVE_KEY = "yar-save-v2";
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
function loadSave() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
class Bankrupt extends Error {}

const daysLeft = () => G.deadline == null ? 99999 : Math.max(0, G.deadline - G.day);
const monthly = () => Object.values(G.income).reduce((a, b) => a + b, 0) + G.pop * 25;
const can = x => G.budget >= x;

function hud() {
  const d = new Date(START.getTime() + G.day * 864e5);
  const ds = d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "2-digit" });
  const inc = monthly(), left = daysLeft();
  const when = G.deadline == null ? `${ds} · ГОД ${G.year}` : `${ds} · ${left} ДН.`;
  HUD.innerHTML = `
    <div class="row">
      <span class="chip r">${when}</span>
      <span class="chip y">${G.chapter}</span>
      <span class="chip b">♥ ${G.trust}</span>${G.smog > 15 ? `<span class="chip" style="color:#c9a27a">🌫 ${Math.round(G.smog)}</span>` : ""}
    </div>
    <div class="row" style="margin-top:5px">
      <span class="chip g">👥 ${fmt(G.pop)} / ${fmt(G.goal)}</span>
      <span class="chip y">${money(G.budget)} <span style="color:${inc >= 0 ? "var(--green)" : "var(--red)"}">${inc >= 0 ? "+" : ""}${fmt(inc)}/мес</span></span>
    </div>
    <div class="bar"><i style="width:${Math.min(100, G.pop / G.goal * 100)}%"></i></div>`;
}
// ───────────── вывод текста ─────────────
async function say(html, cls = "p", wait = 260) {
  const el = document.createElement("div");
  el.className = cls === "p" ? "p" : "p " + cls;
  el.innerHTML = html;
  LOG.appendChild(el);
  LOG.scrollTop = LOG.scrollHeight;
  hud();
  await sleep(wait);
}
const H = t => say(t, "h", 350);
const BIG = (t, red) => say(t, red ? "big r" : "big", 400);
const STAMP = t => say(t, "stamp", 450);
const Q = t => say("«" + t + "»", "quote", 320);
const clear = () => { LOG.innerHTML = ""; };

function waitClick(buttons) {
  return new Promise(res => {
    buttons.forEach(([el, val]) => el.addEventListener("click", () => res(val), { once: true }));
  });
}

async function pause(label = "Дальше →") {
  CTL.innerHTML = "";
  const b = document.createElement("button");
  b.className = "btn next"; b.textContent = label;
  CTL.appendChild(b);
  await waitClick([[b, 1]]);
  CTL.innerHTML = "";
  clear();
}

async function choose(title, options, extraHTML = "", grid = false) {
  CTL.innerHTML = extraHTML + `<div class="q">▶ ${title}</div>`;
  const box = document.createElement("div"); box.className = "opts" + (grid ? " grid" : "");
  CTL.appendChild(box);
  const pin = document.createElement("div"); pin.className = "pin";
  const pairs = [];
  for (const [text, cost, key, cls] of options) {
    const b = document.createElement("button");
    b.className = "btn" + (cls ? " " + cls : "");
    let cs = "";
    if (cost > 0 && cost < 1e11) cs = `<span class="cost">${money(cost)}${can(cost) ? "" : " · не хватает"}</span>`;
    else if (cost >= 1e11) cs = `<span class="cost">недоступно</span>`;
    else if (cost < 0) cs = `<span class="cost plus">+${money(-cost)}</span>`;
    b.innerHTML = text + cs;
    if (cost > 0 && !can(cost)) b.disabled = true;
    (cls === "end" ? pin : box).appendChild(b);
    pairs.push([b, [key, cost]]);
  }
  if (pin.children.length) CTL.appendChild(pin);
  const [key, cost] = await waitClick(pairs);
  G.budget -= cost;
  CTL.innerHTML = "";
  hud();
  return key;
}
async function advance(days, quiet) {
  days = Math.min(days, daysLeft());
  G.budget += monthly() * days / 30;
  G.day += days;
  if (!quiet && days > 0) await say(`… прошло ${days} дн.`, "dim", 200);
  hud();
  if (G.budget < 0) throw new Bankrupt();
}
async function addPop(n, why = "") {
  const old = G.pop; G.pop = Math.max(0, G.pop + n); const d = G.pop - old;
  if (d) City.float((d > 0 ? "+" : "−") + fmt(Math.abs(d)) + " жителей", d > 0 ? "#4fd17a" : "#ff5a4f");
  if (d) await say(`<span class="${d > 0 ? "green" : "red"}">${d > 0 ? "+" : "−"}${fmt(Math.abs(d))} жителей</span> <span class="dim">${why}</span>`, "delta", 300);
}
async function addTrust(n) {
  G.trust = Math.max(0, Math.min(100, G.trust + n));
  await say(`<span class="${n > 0 ? "blue" : "red"}">доверие жителей ${n > 0 ? "+" : ""}${n}</span>`, "delta", 250);
}

// ───────────── главы ─────────────
async function prologue() {
  clear(); hud();
  await H("Угольный Яр");
  await say("ЖИТЕЛЕЙ", "dim");
  await BIG("50 000");
  await say("Столько людей жило здесь, когда работала шахта «Северная».");
  await BIG("312", true);
  await say("Всего триста двенадцать. Тёмные окна, пустые подъезды.");
  await STAMP("ЗАКРЫТО · 2014");
  await say("Шахту закрыли. Работы нет. Молодые уехали. Через год, говорят, никто не останется.");
  await say("Тебя назначили главой посёлка. Условие губернатора: <b>за 365 дней вернуть городу 50 000 жителей</b>. Иначе Угольный Яр расселят и сотрут с карты.");
  await say(`На счету посёлка: <span class="gold">${money(G.budget)}</span>.`);
  await pause("Начать →");
}

async function ch1() {
  G.chapter = "1. ТЕПЛО"; City.focus("boiler", 6000); await H("Часть 1 · Тепло");
  await say("Ноябрь. −34°. Котельная стоит с 2014-го, в квартирах — как на улице.");
  await say("На складе шахты лежит гора угля, которую так и не вывезли:");
  await BIG("100 000 т угля");
  const k = await choose("Как дать людям тепло?", [
    ["Восстановить старую угольную котельную (уголь со склада бесплатный)", 5200000, "coal"],
    ["Поставить электрокотлы (быстрее, но дорогое электричество)", 3000000, "elec"],
    ["Раздать буржуйки и дрова — пусть греются сами", 600000, "stove"],

  if (k === "coal") {
    await advance(37);
    await say("Трубы гудят. Над котельной впервые за 12 лет поднимается дым.");
    await say("Дед Матвей, бывший горный мастер, стоит у окна в шапке-ушанке:");

  } else if (k === "elec") {
    await advance(25); G.income["Электрокотлы"] = -250000;

  } else {
    await advance(10);
    await say("Люди топят буржуйки, в подъездах пахнет дымом. Несколько семей не выдерживают.");
    await addPop(-60, "уехали от холода"); await addTrust(-15);
  }

}

async function ch2() {
  G.chapter = "2. ДОРОГА"; City.focus("road", 6000); await H("Часть 2 · Дорога");
  await say("До трассы — 60 километров. Зимой дорогу заметает так, что даже вахтовый автобус не проходит неделями.");
  await BIG("60 КМ");
  const k = await choose("Что делать с дорогой?", [
    ["Положить новый асфальт на все 60 км", 4500000, "asphalt"],

  G.chapter = "3. СВЕТ"; City.focus("light", 6000); await H("Часть 3 · Свет");

  const k = await choose("Как вернуть свет?", [
    ["Купить и поставить новый трансформатор", 2400000, "trafo"],

  G.flags.light = k;

  else { await advance(10); G.income["Солярка"] = -250000; await say("Генераторы тарахтят на весь посёлок, но свет есть."); }

async function ch4() {
  G.chapter = "4. ШАХТА?"; City.focus("mine", 6000); await H("Часть 4 · Шахта?");

  await say("А этой ночью, в 02:14, ты возвращаешься из райцентра и видишь у вентиляционного ствола…");

    ["Вызвать полицию — посторонним в шахте не место", 0, "police"],

  ]);

    await BIG("ДЕД МАТВЕЙ");

  } else if (k === "police") {

    await STAMP("ШАХТА ЗАТОПЛЕНА");
    await say("Посёлок узнаёт, кто вызвал полицию на старика.");
    G.flags.mine = "flooded"; G.flags.matvey = false; await addTrust(-25);
  } else {
    await say("Через месяц выясняется: это был дед Матвей, и шахта цела только благодаря ему. Но он уже не верит, что ты на стороне людей.");

  }
  await pause();
  await say("Утро. У ворот шахты собираются мужики в старых касках.");
  await H("Нужна работа. Других работ нет.");
  await say("Рядом — электростанция, которой нужен уголь.");
  let k2;
  if (G.flags.mine === "alive") {
    k2 = await choose("Что делать с шахтой?", [
      ["Открыть угольный разрез и возить уголь на электростанцию", 1800000, "open"],
      ["Сдать оборудование на металлолом", -1500000, "scrap"],
    ]);

function quality() {
  const f = G.flags; let q = 0;
  q += { coal: .10, elec: .08, stove: -.10 }[f.heat];
  q += { 0: -.10, 1: .05, 2: .10 }[f.road];
  q += { trafo: .06, diesel: .02 }[f.light];
  q += { deep: .08, shallow: .06, truck: -.06 }[f.water];
  q += { tower: .06, sat: .02, none: -.06 }[f.comm];
  q += { own: .07, subsidy: .04, none: -.08 }[f.shops];
  q += (f.lift && f.lift !== "none") ? .05 : 0;
  q += (G.trust - 50) / 500;
  return q;
}
function infraScore() {
  const f = G.flags;
  const pts = [f.heat === "coal", f.road >= 1, f.road === 2, f.light === "trafo", f.mine_open,
    ["deep", "shallow"].includes(f.water), f.comm === "tower", ["own", "subsidy"].includes(f.shops),
    f.lift && f.lift !== "none", f.housing_choice === "people", G.trust >= 70];
  return 1 + pts.filter(Boolean).length;
}
const support = () => G.jobs + Math.floor(G.pop * 0.3);

    } else { resume = null; newGame(); }
    try {
      while (G.step < STEPS.length) {
        save();

// ── ход месяца: меню строительства, рост, события ──
const MS_BONUS = [[10000, 4000000], [25000, 6000000], [75000, 10000000], [100000, 15000000], [150000, 20000000],
                  [250000, 30000000], [500000, 50000000], [1000000, 100000000]];

function needSchools() { return Math.floor(G.pop / 15000); }
function needHosp() { return Math.floor(G.pop / 40000); }
function serviceFactor() {
  if (G.act < 2) return 1;
  const ds = Math.max(0, needSchools() - G.schools), dh = Math.max(0, needHosp() - G.hospitals);
  return Math.max(.3, 1 - .12 * ds - .18 * dh);
}
function factoryCap() {
  return infraScore() + (G.capBonus || 0) + (G.act >= 2 ? Math.floor(G.pop / 12000) : 0);
}
function factoryCost() { return G.act >= 2 ? 6000000 + Math.floor(G.factories / 5) * 1000000 : FACTORY_COST; }
function microCost() { return (G.a2.north === "muni" ? 12000000 : 9000000) + (G.micro || 0) * 600000; }
const MAX_BLOCKS = 20;

async function growthTick(days) {
  const cap = Math.min(G.housing, support());
  const smogF = 1 - Math.min(.5, (G.smog || 0) / 250);
  let rate = Math.max(.08, Math.min(.8, .2 + 1.2 * quality() + .1 * G.ads)) * serviceFactor() * smogF * days / 30;
  if (cap > G.pop) {
    let gain = Math.floor((cap - G.pop) * rate);
    if (G.act >= 2) gain = Math.min(gain, Math.floor((G.pop * .03 + 2000) * (1 + .3 * G.ads + a3boost()) * serviceFactor() * smogF * days / 30));
    await addPop(gain, "переехали в город");
  }
  else if (cap < G.pop) await addPop(-Math.floor((G.pop - cap) * .25 * days / 30), G.housing < support() ? "негде жить" : "нет работы");
  G.ads = 0;
}

function capsHTML() {
  const fmax = factoryCap();
  let h = `<div class="caps">
    <div class="cap">🏠 Жильё<b>${fmt(G.housing)}</b></div>
    <div class="cap">🏭 Работа<b>${fmt(support())}</b></div>
    <div class="cap">Заводы<b>${G.factories}/${fmax}</b></div>`;
  if (G.act >= 2) {
    const ns = needSchools(), nh = needHosp();
    h += `<div class="cap ${G.schools < ns ? "warn" : ""}">🏫 Школы<b>${G.schools}/${ns}</b></div>
          <div class="cap ${G.hospitals < nh ? "warn" : ""}">🏥 Больн.<b>${G.hospitals}/${nh}</b></div>`;
  }
  return h + `</div>`;
}

function buildMenu() {
  const fmax = factoryCap(), act2 = G.act >= 2;
  const fname = FACTORY_NAMES[G.factories % FACTORY_NAMES.length];
  const opts = [];
  opts.push(G.factories < fmax
    ? [`🏭 Завод<small>${fname}</small>`, factoryCost(), "factory"]
    : [`🏭 Завод<small>инвесторам не хватает инфраструктуры</small>`, 1e12, "factory"]);

    opts.push([`🏫 Школа<small>нужна на 15 000 жителей</small>`, 2000000, "school"]);
    opts.push([`🏥 Больница<small>нужна на 40 000</small>`, 4500000, "hosp"]);
    opts.push([`🌳 Парк<small>доверие ↑, смог ↓</small>`, 1500000, "park"]);
    opts.push([`🛍 Торговый центр<small>+2 500 работы, доход</small>`, 3500000, "mall"]);
  }
  opts.push([`📣 Реклама<small>быстрее переезжают</small>`, act2 ? 1200000 : AD_COST, "ad"]);

  if (G.deadline == null) opts.push(["⏩ 3 месяца", 0, "end3", "end"]);
  return opts;
}

async function doBuild(k) {
  if (k === "factory") {
    G.factories++; G.jobs += FACTORY_JOBS;
    G.income["Заводы"] = (G.income["Заводы"] || 0) + FACTORY_INCOME;
    if (G.act >= 2) G.smog = Math.min(100, (G.smog || 0) + (G.flags.filters ? 1.5 : 4));
    await say(`Строится: <b>${FACTORY_NAMES[(G.factories - 1) % FACTORY_NAMES.length]}</b>`, "green", 120);
  } else if (k === "block") {
    G.blocks++; G.housing += BLOCK_HOMES;
    await say("Пятиэтажки в лесах. Скоро — новые жильцы.", "green", 120);
  } else if (k === "micro") {
    G.micro++; G.housing += 25000;
    await say("Микрорайон «Северный»: краны, котлованы, три новые высотки.", "green", 120);
  } else if (k === "school") {
    G.schools++; G.jobs += 120; await say("Новая школа: 1 100 мест, бассейн и кружок робототехники.", "green", 120);
  } else if (k === "hosp") {
    G.hospitals++; G.jobs += 600; await say("Больница открыта: приёмный покой, роддом, вертолётная площадка.", "green", 120);
  } else if (k === "park") {
    G.parks++; G.trust = Math.min(100, G.trust + 3); G.smog = Math.max(0, (G.smog || 0) - 5);
    await say(G.parks === 1 ? "Парк с колесом обозрения — над городом видно гору и копёр." : "Ещё один парк: аллеи, фонари, каток.", "green", 120);
  } else if (k === "mall") {
    G.malls++; G.jobs += 2500; G.income["Торговые центры"] = (G.income["Торговые центры"] || 0) + 400000;
    await say("Торговый центр: кино, фудкорт, очередь на открытии.", "green", 120);
  } else if (k === "ad") {
    G.ads++; await say("Ролик про Угольный Яр набирает миллионы просмотров.", "green", 120);
  }
}

async function monthTurn() {
  save();
  hud();
  const title = G.deadline == null ? `Год ${G.year} · месяц ${((G.month - 1) % 12) + 1}` : `Месяц ${G.month}`;
  await say(title, "h");
  if (G.act >= 2) {
    const ns = needSchools(), nh = needHosp();
    if (G.schools < ns || G.hospitals < nh)
      await say(`⚠ Не хватает ${G.schools < ns ? `школ: ${ns - G.schools}` : ""}${G.schools < ns && G.hospitals < nh ? ", " : ""}${G.hospitals < nh ? `больниц: ${nh - G.hospitals}` : ""} — люди переезжают медленнее.`, "dim", 150);
    if ((G.smog || 0) > 40) await say(`🌫 Смог над городом: ${Math.round(G.smog)}. Рост замедляется, доверие падает.`, "dim", 150);
  }
  while (true) {
    const k = await choose("Что строим?", buildMenu(), capsHTML(), true);
    if (k === "end" || k === "end3") { G._skip3 = k === "end3"; break; }
    await doBuild(k);
  }
  const days = G._skip3 ? 90 : Math.min(30, daysLeft());
  if (G._skip3) { G.month += 2; G._skip3 = false; }
  await advance(days);
  await growthTick(days);
  if ((G.smog || 0) > 40 && G.act >= 2) G.trust = Math.max(0, G.trust - 2);
  if (G.act >= 2) G.smog = Math.max(0, (G.smog || 0) - (G.parks || 0) * .3);
  for (const [m, bonus] of MS_BONUS) {
    if (G.pop >= m && !G.flags["ms" + m]) {
      G.flags["ms" + m] = true; G.budget += bonus;
      City.float(`🎉 ${fmt(m)}`, "#f4c84a");
      await say(`🎉 ${fmt(m)} жителей! Область добавляет ${money(bonus)}.`, "gold");
    }
  }
  await freezeEvent();
  if (G.deadline == null) G.year = Math.floor(G.month / 12) + 1;
  await sleep(500);
  clear();
}

async function randomEvent() {
  if (Math.random() > .55) return;
  const pool = RANDOM_EVENTS.filter(e => e.cond() && G.a2["last_" + e.id] !== G.month - 1);
  if (!pool.length) return;
  const e = pool[Math.floor(Math.random() * pool.length)];
  G.a2["last_" + e.id] = G.month;
  clear();
  await e.run();
  await pause();
}

    G.act = 2; G.a2.started = true; G.chapter = "ЧАСТЬ II"; G.month = 0;
    G.goal = 150000; G.deadline = G.day + 730;
    G.schools = Math.max(G.schools, 2); G.hospitals = Math.max(G.hospitals, 1);
    G.housing = Math.max(G.housing, G.pop);
    clear(); City.focus("wide", 9000);
    await H("Часть II · Большой Яр");
    await say("Через неделю после комиссии звонит губернатор.");
    await Q(`${fmt(G.pop)} человек за год. Такого в области не было. Хочу, чтобы Яр стал вторым городом области. Даю два года.`);
    await BIG("150 000");
    await say("Цель — 150 000 жителей за 730 дней. Область выделяет стартовый фонд.");
    G.budget += 30000000;
    await say(`+${money(30000000)} на счёт`, "green");
    await say("Новое в меню: 🏫 школы, 🏥 больницы, 🌳 парки, 🛍 торговые центры. Без школ и больниц город растёт медленнее. Заводы дают смог — следи за ним.", "dim");
    await pause("Вперёд →");
    save();
  }
  while (daysLeft() > 3) {
    G.month++;
    const ev = A2_STORY.find(e => !G.a2[e.id] && G.month >= e.at && (!e.cond || e.cond()));
    if (ev) { G.a2[ev.id] = true; clear(); await ev.run(); await pause(); }
    else await randomEvent();
    if (daysLeft() <= 3) break;
    G.chapter = "II · СТРОЙКА";
    await monthTurn();
  }
}

async function finale2() {
  G.chapter = "ФИНАЛ II"; clear();
  City.focus("wide", 12000);
  await H("Два года спустя");
  await say(G.flags.airport === "full" ? "Губернатор прилетает в Яр — теперь сюда можно прилететь." : "Губернатор приезжает в Яр по трассе.");
  await say("С балкона мэрии видно весь город: от копра до огней «Северного».");
  await sleep(800);
  await BIG(fmt(G.pop), G.pop < G.goal);
  let title;
  if (G.pop >= 150000) { await STAMP("ВТОРОЙ ГОРОД ОБЛАСТИ"); title = "Большой Яр"; await say("Указ подписан: Угольный Яр получает статус города областного значения."); }
  else if (G.pop >= 90000) { await say("ПОЧТИ", "gold"); title = "Растущий Яр"; await say("До плана не дотянули, но губернатор доволен: такого роста нет нигде в Сибири."); }
  else { await say("ПЛАН НЕ ВЫПОЛНЕН", "red"); title = "Упрямый Яр"; await say("В области недовольны. Но город живёт — и будет жить."); }
  if (G.flags.museum && G.flags.matvey) await say("Вечером дед Матвей поднимается на смотровую площадку копра. Внизу — сто тысяч огней.");
  await say(`<span class="dim">Итоги части II:</span><br>Жителей: <b>${fmt(G.pop)}</b><br>Заводов: ${G.factories}, микрорайонов: ${G.micro}<br>Школ: ${G.schools}, больниц: ${G.hospitals}, парков: ${G.parks}<br>Смог: ${Math.round(G.smog || 0)} · Доверие: ${G.trust}`);
  const k = await choose("Дальше:", [
    ["▶ Свободная игра: строй город без срока", 0, "free", "next"],
    ["Начать заново ↻", 0, "new"],
  ]);
  if (k === "new") return false;
  G.a2.title = title;
}

// ═══════════════════════════════════════════════════════════════════
//  ЧАСТЬ III · «МИЛЛИОННИК» — сюжет внутри свободной игры
// ═══════════════════════════════════════════════════════════════════
// Цена растёт вместе с экономикой: не меньше base и не меньше mult месяцев дохода.
function P(mult, base) { return Math.round(Math.max(base, monthly() * mult) / 1000000) * 1000000; }
function a3boost() { return (G.a3 && G.a3.boost) || 0; }

const A3_STORY = [
  { id: "metro", pop: 180000, run: async () => {
      G.chapter = "III·1 МЕТРО"; City.focus("metro", 6000);
      await H("Часть III · Метро");
      await say("Утром проспект Шахтёров стоит в пробке от копра до вокзала. Трамваи битком, автобусы не справляются.");
      await say("Метростроевцы из Новосибирска готовы зайти: грунт плотный, а у города есть то, чего нет ни у кого, — шахтёры.");
      await BIG("6 СТАНЦИЙ");
      const full = P(2.5, 120000000), lrt = P(1, 40000000);
      const k = await choose("Транспорт для большого города:", [
        ["🚇 Метро: первая линия, 6 станций — копали шахтёры", full, "full"],
        ["🚊 Скоростной трамвай по выделенке (ЛРТ)", lrt, "lrt"],
        ["🚌 Ещё автобусов", 8000000, "bus"],
        ["⏳ Отложить — вернёмся через 3 месяца", 0, "later"],
      ]);
      if (k === "later") return "later";
      G.a3.metro = k;
      if (k === "full") { await advance(60); G.a3.boost = a3boost() + .2; G.capBonus += 3; G.jobs += 8000; G.trust = Math.min(100, G.trust + 10);
        await say("Станция «Шахтёрская» украшена старыми касками и лампами. Первый поезд ведёт сын деда Матвея.");
        if (G.flags.matvey) await Q("Под землёй опять наши. Только теперь — с поездами."); }
      else if (k === "lrt") { await advance(35); G.a3.boost = a3boost() + .15; G.capBonus += 1; G.jobs += 3000; await say("Синие вагоны идут по выделенке — 12 минут от вокзала до горы."); }
      else { await advance(10); G.trust = Math.max(0, G.trust - 6); await say("Автобусов стало больше. Пробок — тоже."); }
  } },
  { id: "bridge", pop: 240000, run: async () => {
      G.chapter = "III·2 ЛЕВЫЙ БЕРЕГ"; City.focus("river", 6000);
      await H("Левый берег");
      await say("Город упёрся в реку. На правом берегу места больше нет, а левый — пустой: сосны, песок, старые дачи.");
      await say("Мост откроет место для целого нового района.");
      await BIG("1 200 М");
      const cable = P(3, 150000000), pont = P(.7, 25000000);
      const k = await choose("Как перейти реку?", [
        ["🌉 Вантовый мост с пилоном 180 м — символ города", cable, "cable"],
        ["⛴ Наплавной мост и паром", pont, "pont"],
        ["Пока строим вверх, а не вширь", 0, "none"],
        ["⏳ Отложить — вернёмся через 3 месяца", 0, "later"],
      ]);
      if (k === "later") return "later";
      if (k !== "none") {
        G.a3.bridge = k; await advance(k === "cable" ? 75 : 30);
        G.housing += k === "cable" ? 80000 : 20000; G.a3.boost = a3boost() + (k === "cable" ? .12 : .04);
        await say(k === "cable" ? "Пилон светится над рекой, ванты как струны. На открытии — 40 тысяч человек и салют." : "Понтоны покачиваются, летом ходит паром. Левый берег заселяется.");
        await addPop(k === "cable" ? 15000 : 4000, "переехали на левый берег");
      } else { await say("Цены на квартиры ползут вверх."); G.trust = Math.max(0, G.trust - 4); }
  } },
  { id: "tower", pop: 300000, run: async () => {
      G.chapter = "III·3 ТЕЛЕБАШНЯ"; City.focus("tvtower", 6000);
      await H("Башня над Яром");
      await say("Старая вышка связи не тянет: 5G, телевидение, аварийная связь для шахт.");
      await say("Архитекторы предлагают башню с вращающимся рестораном — чтобы с неё был виден весь город, гора и река.");
      const full = P(1.5, 90000000);
      const k = await choose("Какую башню ставим?", [
        ["🗼 Телебашня 330 м с рестораном и смотровой", full, "full"],
        ["📡 Простая вышка 5G", 20000000, "5g"],
        ["⏳ Отложить — вернёмся через 3 месяца", 0, "later"],
      ]);
      if (k === "later") return "later";
      G.a3.tower = k; await advance(k === "full" ? 50 : 15);
      if (k === "full") { G.income["Телебашня"] = Math.round(Math.max(3000000, monthly() * .03)); G.trust = Math.min(100, G.trust + 8);
        await say("Ресторан делает оборот за 40 минут. В ясную ночь видно огни посёлков за 80 км."); }
      else { G.jobs += 1500; await say("Связь отличная. Туристы фотографируют гору, а не вышку."); }
  } },
  { id: "games", pop: 400000, run: async () => {
      G.chapter = "III·4 УНИВЕРСИАДА"; City.focus("stadium", 6000);
      await H("Универсиада");
      await say("Министерство спорта ищет город для зимней Универсиады. Нужны стадион, трассы, аэропорт и гостиницы.");
      const chance = (G.flags.cup ? .25 : 0) + (G.flags.airport === "full" ? .25 : G.flags.airport ? .1 : 0) + (G.a3.metro === "full" ? .15 : 0) + .25;
      await say(`Шансы заявки: <b>${Math.round(Math.min(.95, chance) * 100)}%</b> (кубок мира, аэропорт и метро помогают).`, "dim");
      const bid = P(3, 250000000), nat = P(1, 60000000);
      const k = await choose("Участвуем?", [
        ["🏟 Подать заявку: стадион на 40 000 и деревня спортсменов", bid, "bid"],
        ["🏅 Провести всероссийские игры — надёжно", nat, "nat"],
        ["Не участвуем", 0, "none"],
        ["⏳ Отложить — следующий отбор через 3 месяца", 0, "later"],
      ]);
      if (k === "later") return "later";
      if (k === "none") { await say("Универсиаду проводят в Красноярске."); return; }
      await advance(k === "bid" ? 60 : 30);
      G.a3.games = "built"; G.a3.gamesDay = G.day;
      if (k === "bid") {
        await say("Москва. Голосование. Конверт открывают медленно…");
        if (Math.random() < Math.min(.95, chance)) {
          G.a3.games = "won"; await STAMP("УГОЛЬНЫЙ ЯР");
          await say("Яр принимает Универсиаду! Спонсоры, телевидение, 60 стран.");
          G.budget += P(3, 120000000); G.a3.boost = a3boost() + .15; G.income["Универсиада и туризм"] = Math.round(monthly() * .05);
          await addPop(30000, "переехали работать на Универсиаду");
        } else {
          await say("Проиграли Казани в два голоса. Стадион остаётся городу.", "red");
          G.trust = Math.max(0, G.trust - 5); G.a3.boost = a3boost() + .05;
        }
      } else { G.a3.boost = a3boost() + .08; await say("Всероссийские игры прошли без единой накладки. Стадион полон каждые выходные."); await addPop(6000, "болельщики остались жить"); }
  } },
  { id: "vsm", pop: 550000, run: async () => {
      G.chapter = "III·5 МАГИСТРАЛЬ"; City.focus("vsm", 6000);
      await H("Скоростная магистраль");
      await say("РЖД проектирует высокоскоростную магистраль на восток. Трасса может пройти через Яр — или в 200 км южнее.");
      await BIG("2 ЧАСА ДО НОВОСИБИРСКА", false);
      const vsm = P(3, 300000000);
      const k = await choose("Бьёмся за магистраль?", [
        ["🚄 Да: доля города в строительстве и вокзал ВСМ", vsm, "yes"],
        ["Пусть идёт южнее", 0, "no"],
        ["⏳ Отложить — РЖД ждёт ответа 3 месяца", 0, "later"],
      ]);
      if (k === "later") return "later";
      if (k === "yes") {
        G.a3.vsm = true; if (!G.flags.rail) G.flags.rail = "electric";
        await advance(90); G.a3.boost = a3boost() + .2; G.income["ВСМ"] = Math.round(monthly() * .04); G.capBonus += 3;
        await say("Белый поезд проходит мост за 9 секунд. Утром — в Новосибирске, вечером — дома.");
        await addPop(20000, "приехали по ВСМ");
      } else await say("Магистраль ушла южнее. Яр остался в стороне от главного пути.");
  } },
  { id: "matvey", pop: 750000, run: async () => {
      G.chapter = "III·6 ДЕВЯНОСТО"; City.focus("monument", 7000);
      await H("Девяносто лет");
      if (G.flags.matvey) {
        await say("Деду Матвею — девяносто. Он всё так же каждое утро спускается в шахтёрский музей — проверить насосы, «на всякий случай».");
        await Q("Когда я двенадцать лет один качал воду, думал: дурак старый. А оно вон как вышло.");
      } else {
        await say("Старейшему шахтёру Яра — девяносто. Говорят, он двенадцать лет в одиночку держал насосы в закрытой шахте.");
      }
      await say("Горожане собрали подписи: хотят отметить его так, чтобы помнили дети.");
      const k = await choose("Как отметим?", [
        ["🗿 Памятник «Шахтёр, который не ушёл» перед ДК", 30000000, "monument"],
        ["🪧 Назвать главную площадь его именем", 0, "square"],
      ]);
      G.a3.matvey = k; G.trust = Math.min(100, G.trust + 12);
      await advance(k === "monument" ? 30 : 5);
      await say(k === "monument" ? "Бронзовый шахтёр поднимает лампу над площадью. Лампа горит всегда." : "На табличке: «Площадь Матвея». Он ворчит, что не заслужил, — и приходит туда каждый вечер.");
  } },
];

async function act3Story() {
  G.a3 = G.a3 || {};
  const ev = A3_STORY.find(e => !G.a3["done_" + e.id] && G.pop >= e.pop && (G.a3["wait_" + e.id] || 0) <= G.month);
  if (!ev) return false;
  G.a3["done_" + ev.id] = true;
  clear();
  const r = await ev.run();
  if (r === "later") { G.a3["done_" + ev.id] = false; G.a3["wait_" + ev.id] = G.month + 3; await say("Хорошо. Вернёмся к этому через три месяца — копите бюджет.", "dim"); }
  await pause(); G.chapter = "ГОРОД"; save();
  return true;
}

async function act3() {
  if (!G.a2.free) {
    G.a2.free = true; G.act = 3; G.deadline = null; G.year = 1; G.month = 0;
    G.goal = G.pop < 250000 ? 250000 : G.pop < 500000 ? 500000 : 1000000;
    clear();
    await H("Свободная игра");
    await say("Срока больше нет. Цели: 250 000 → 500 000 → миллион и дальше. За каждую — награда области.");
    await say("Впереди — Часть III: метро, мост на левый берег, телебашня, Универсиада, скоростная магистраль. Главы откроются, когда город вырастет.", "gold");
    await say("Игра сохраняется сама каждый месяц.", "dim");
    await pause("Строить →");
  }
  G.a3 = G.a3 || {};
  while (true) {
    G.month++;
    G.chapter = "ГОРОД";
    if (!(await act3Story())) await randomEvent();
    await monthTurn();
    if (G.pop >= G.goal) {
      clear();
      const titles = { 250000: "Крупный город", 500000: "Большой город", 1000000: "Миллионник", 2000000: "Два миллиона", 3000000: "Агломерация" };
      await H(titles[G.goal] || "Новая цель");
      await BIG(fmt(G.goal));
      await STAMP(G.goal >= 1000000 ? "ГОРОД-МИЛЛИОННИК" : "ЦЕЛЬ ДОСТИГНУТА");
      if (G.goal >= 1000000) { await say("Миллион. Двенадцать лет назад здесь горело 312 окон."); if (G.flags.matvey) await Q("Я ж говорил — вернутся."); G.goal = 2000000; }
      else if (G.goal >= 2000000) { await say("Агломерация растёт: Яр — один из крупнейших городов Сибири."); G.goal += 1000000; }
      else G.goal = G.goal === 250000 ? 500000 : 1000000;
      if (G.goal >= 2000000 && G.pop >= G.goal) G.goal += 1000000;
      await say(`Следующая цель: ${fmt(G.goal)}.`);
      await pause();
    }
  }
}

</script>

<style>

<script>
(function(){
  const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let seen = false; try { seen = localStorage.getItem("yar-hint") === "1"; } catch (e) {}
  const el = document.getElementById("ios-hint");
  if (ios && !standalone && !seen) setTimeout(() => { el.hidden = false; }, 2500);
  el.querySelector(".ih-x").onclick = () => { el.hidden = true; try { localStorage.setItem("yar-hint", "1"); } catch (e) {} };
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  document.addEventListener("gesturestart", e => e.preventDefault());
})();
</script>

<div id="upd" hidden><button id="upd-btn">✨ Вышло обновление <b id="upd-v"></b> — обновить</button></div>
<style>
#upd{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 64px);z-index:120;display:flex;justify-content:center;pointer-events:none}
#upd[hidden]{display:none}
#upd button{pointer-events:auto;border:0;border-radius:999px;padding:10px 16px;font:700 14px system-ui,sans-serif;color:#1a1405;
  background:linear-gradient(180deg,#ffdf7e,#f4c84a);box-shadow:0 10px 30px rgba(244,200,74,.45);animation:ihUp .4s ease both}
</style>
<script>
(function(){
  const APP_VERSION = "3.0";
  let shown = false;
  async function check() {
    try {
      const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
      const j = await r.json();
      if (j.v && j.v !== APP_VERSION && !shown) {
        shown = true;
        document.getElementById("upd-v").textContent = j.v;
        document.getElementById("upd").hidden = false;
      }
    } catch (e) {}
  }
  document.getElementById("upd-btn").onclick = async () => {
    try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch (e) {}
    try { if (window.save) save(); } catch (e) {}
    location.reload();
  };
  /* WebView: обновления приходят с APK */
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
  setInterval(check, 15 * 60 * 1000);
})();
</script>
