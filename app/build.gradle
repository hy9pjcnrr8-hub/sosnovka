plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.ugolnyyar.game'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.ugolnyyar.game'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Подписываем release тем же debug-ключом, чтобы APK сразу ставился на телефон
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
