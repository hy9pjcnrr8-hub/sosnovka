name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk UgolnyYar.apk
          cp nativeapp/build/outputs/apk/release/nativeapp-release.apk UgolnyYar-native.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UgolnyYar-apk
          path: |
            UgolnyYar.apk
            UgolnyYar-native.apk

      - name: Check APK
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
          for f in UgolnyYar.apk UgolnyYar-native.apk; do
            echo "== $f"
            $AAPT dump badging $f | grep -E "package:|application-label:|sdkVersion"
            $(dirname $AAPT)/apksigner verify --print-certs $f | head -1
            unzip -l $f | grep -E "index.html|classes.dex"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest UgolnyYar.apk UgolnyYar-native.apk \
            --title "Угольный Яр — APK" \
            --notes "UgolnyYar-native.apk — нативная версия (без браузерного движка). UgolnyYar.apk — версия на WebView. Скачай нужную и установи на Android (разреши установку из неизвестных источников)." \
            --target "${{ github.sha }}"
