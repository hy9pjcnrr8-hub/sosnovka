name: Smoke test (emulator)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :nativeapp:assembleRelease --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: bash .github/smoke.sh

      - name: Publish screenshots to ci-shots branch
        if: always()
        run: |
          cd ci-shots
          git init -q -b ci-shots
          git config user.name "ci"; git config user.email "ci@example.com"
          git add -A && git commit -qm "screenshots ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots
